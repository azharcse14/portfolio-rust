# Fly.io app config — production deployment.
# After `flyctl launch --no-deploy`, this file is generated by fly; we hand-tune it.

app = "azharcse14-portfolio"
primary_region = "sin"  # Singapore — low latency from Bangladesh + South Asia
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  LEPTOS_SITE_ADDR = "0.0.0.0:8080"
  LEPTOS_SITE_ROOT = "/app/site"
  LEPTOS_OUTPUT_NAME = "portfolio"
  DATABASE_URL = "sqlite:///data/portfolio.db?mode=rwc"
  RUST_LOG = "info"

# Persistent volume for SQLite. Create once with:
#   flyctl volumes create portfolio_data --region sin --size 1
[mounts]
  source = "portfolio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # free tier — scale to zero when idle
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/robots.txt"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

[[restart]]
  policy = "on-failure"
  retries = 5
